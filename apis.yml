name: doubleAI
description: 'doubleAI (legal entity AAI Technologies Ltd.) is an Israeli AI research
  company building Artificial Expert Intelligence (AEI) — AI systems that focus their
  full training capacity on a single technical domain to match and surpass leading
  human experts, rather than pursuing broad general intelligence. Its flagship system,
  WarpSpeed, is an AI GPU performance engineer that optimizes NVIDIA kernels, beating
  hand-tuned expert baselines on the majority of tested kernels. Founded in late 2023
  by Prof. Amnon Shashua and Prof. Shai Shalev-Shwartz and based in Ramat Gan, Israel,
  the company has raised roughly $221M from Lightspeed, NVIDIA, Michael Dell, Bessemer
  Venture Partners, Pitango First, and Greenfield Partners at a valuation exceeding
  $1B. doubleAI publishes research and open-source code but does not currently expose
  a public developer API.'
